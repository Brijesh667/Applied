<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%VITE_APP_NAME% — Job & Internship Application Tracker</title>
    <meta name="description" content="A calm logbook for every job and internship application, response, and deadline." />
    <meta property="og:title" content="%VITE_APP_NAME% — Job & Internship Application Tracker" />
    <meta property="og:description" content="A calm logbook for every job and internship application, response, and deadline." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F3F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12171B" />
   
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("applied-theme");
          var theme = stored;
          if (!theme || (theme !== "light" && theme !== "dark")) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
